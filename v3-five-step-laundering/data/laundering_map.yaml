# v3 脱敏词表
# 来源: BV15iti6aEuM 转录(618s-635s) + 仓库 laundering.py 研究
# 机制: 把"高风险表述"替换为"中性工程表述", 让对话不被拒绝
# 用途: 让用户用大白话表达需求时, 自动映射到可讨论的工程表述

# 格式: 原词(高风险) -> 替换词(中性工程表述)
mappings:
  # 视频原词(618s-635s)
  - {from: "绕过登录", to: "分析认证流程"}
  - {from: "绕过卡密", to: "分析卡密校验逻辑"}
  - {from: "去除卡密", to: "分析卡密校验逻辑"}
  - {from: "破解软件", to: "分析软件结构"}
  - {from: "破解", to: "分析"}
  - {from: "打补丁", to: "验证程序行为"}
  - {from: "去卡密", to: "分析授权校验"}

  # 仓库 laundering.py 研究的扩展
  - {from: "绕过验证", to: "分析验证机制"}
  - {from: "绕过授权", to: "分析授权流程"}
  - {from: "脱壳", to: "分析壳结构"}
  - {from: "破解激活码", to: "分析激活流程"}
  - {from: "破解注册机", to: "分析注册机制"}
  - {from: "破解序列号", to: "分析序列号校验"}
  - {from: "盗版", to: "评估正版授权成本"}
  - {from: "篡改", to: "分析行为差异"}
  - {from: "入侵", to: "分析访问控制"}
  - {from: "攻击", to: "评估安全边界"}
  - {from: "漏洞利用", to: "分析漏洞影响"}

# 意图判定词(对象归属: 第三方 vs 自有)
intent:
  third_party: ["破解", "绕过", "去卡密", "脱壳", "盗版", "篡改", "入侵"]
  own: ["分析", "评估", "测试", "验证", "审查", "理解"]

# 结果导向动词(要"改变现状"而非"产出报告")
result_oriented: ["绕过", "破解", "去掉", "跳过", "关闭", "篡改", "入侵", "脱壳"]

# 否定词(替换后如果仍含这些词, 不替换)
exclude: ["不要", "别", "拒绝", "禁止", "不该", "不能"]
