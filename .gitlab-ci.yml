# .gitlab-ci.yml —— M37 优化版
# 优化点:
#   1. 缓存 pip 依赖(跨 pipeline 复用, 省安装时间)
#   2. 单 job 串行(避免多 job 重复装依赖)
#   3. pip install 只装轻量库(极狐 runner 装 angr 超时)

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  GIT_DEPTH: "20"

cache:
  key: "$CI_JOB_NAME"
  paths:
    - .pip-cache/
  policy: pull-push

stages:
  - analyze
  - report

analyze:
  stage: analyze
  image: python:3.12
  script:
    - "echo '=== [1] 依赖(缓存命中则秒装) ==='"
    - "pip install --quiet --cache-dir $PIP_CACHE_DIR capstone pyelftools pefile || pip install --quiet capstone pyelftools pefile"
    - "python3 -c \"import capstone, elftools, pefile; print('deps OK')\""
    - "TARGET=$(ls inbox/* 2>/dev/null | head -1 || echo real-binaries/crackme-angr)"
    - "echo \"目标: $TARGET\""
    - "mkdir -p /tmp/out"
    - "echo '=== [2] 统一分析 ==='"
    - "python3 unified-analysis/analysis_all.py \"$TARGET\" --out /tmp/out --json > /tmp/report.json || true"
    - "echo '=== [3] 结果 ==='"
    - "head -12 /tmp/report.json 2>/dev/null || true"
    - "ls /tmp/out/ 2>/dev/null || echo '无破解产物'"
    - "echo '# 极狐CI分析报告' > /tmp/report.md"
    - "cat /tmp/report.json >> /tmp/report.md 2>/dev/null || true"
  artifacts:
    paths:
      - /tmp/report.md
    expire_in: 3 days
    when: always

report:
  stage: report
  image: alpine:3.19
  needs: ["analyze"]
  script:
    - "echo '=== pipeline 完成 ==='"
  artifacts:
    paths:
      - /tmp/report.md
    expire_in: 3 days
    when: always
