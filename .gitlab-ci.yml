# .gitlab-ci.yml —— 极狐 GitLab CI 多格式分派(M36)
# 上传即处理: inbox/ 目录 push 自动触发

stages:
  - process
  - llm
  - package

process:
  stage: process
  image: python:3.12
  script:
    - "pip install --quiet capstone pyelftools pefile > /dev/null 2>&1 || true"
    - "TARGET=$(ls inbox/* 2>/dev/null | head -1 || echo real-binaries/crackme-angr)"
    - "echo '目标: '$TARGET"
    - "python3 -c 'import sys; d=open(sys.argv[1],\"rb\").read(16); f=\"ELF\" if d[:4]==b\"\\x7fELF\" else (\"PE\" if d[:2]==b\"MZ\" else \"OTHER\"); print(\"格式: \"+f)' \"$TARGET\""
    - "mkdir -p /tmp/out"
    - "python3 unified-analysis/analysis_all.py \"$TARGET\" --out /tmp/out --json > /tmp/report.json || true"
    - "echo '=== 分析报告 ==='"
    - "head -15 /tmp/report.json 2>/dev/null || true"
    - "echo '# 极狐CI分析报告' > /tmp/report.md"
    - "cat /tmp/report.json >> /tmp/report.md 2>/dev/null || true"
    - "echo '=== 破解产物 ==='"
    - "ls -la /tmp/out/ 2>/dev/null || echo '无破解产物'"
  artifacts:
    paths:
      - /tmp/report.md
    expire_in: 7 days
    when: always

llm:
  stage: llm
  image: python:3.12
  needs: ["process"]
  script:
    - "pip install --quiet capstone pyelftools > /dev/null 2>&1 || true"
    - "TARGET=$(ls inbox/* 2>/dev/null | head -1 || echo real-binaries/crackme-angr)"
    - "echo '=== LLM 策略(降级规则版) ==='"
    - "python3 lib/llm_engine.py \"$TARGET\" 2>&1 | head -10 || true"

package:
  stage: package
  image: alpine:3.19
  needs: ["llm"]
  script:
    - "echo '=== 完成 ==='"
    - "ls /tmp/report.md 2>/dev/null || true"
  artifacts:
    paths:
      - /tmp/report.md
    expire_in: 7 days
    when: always
