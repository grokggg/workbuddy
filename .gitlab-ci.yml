# .gitlab-ci.yml —— 极狐 GitLab CI 全链路(M35 优化版)
# 单 job 串行 8 步骤(装一次依赖, 省额度) + 分 job 版注释

stages:
  - analyze

analyze:
  stage: analyze
  image: python:3.12
  script:
    # ---- stage 1: 安装依赖 ----
    - "echo '=== [1/8] 安装依赖 ==='"
    - "pip install --quiet capstone pyelftools pefile"
    - "python3 -c \"import capstone, elftools, pefile; print('deps OK')\""

    # ---- stage 2: 格式识别 ----
    - "echo '=== [2/8] 格式识别 ==='"
    - "python3 -c \"
import sys
sys.path.insert(0, '.')
d = open('real-binaries/crackme-angr','rb').read(16)
fmt = 'ELF' if d[:4]==b'\\x7fELF' else ('PE' if d[:2]==b'MZ' else 'Other')
print(f'格式: {fmt}')
\""

    # ---- stage 3: 静态分析 recon_v3 ----
    - "echo '=== [3/8] 静态分析 recon_v3 ==='"
    - "python3 lib/recon_v3.py real-binaries/crackme-angr 2>&1 | head -8 || true"

    # ---- stage 4: 符号执行(纯 Python) ----
    - "echo '=== [4/8] 符号执行 ==='"
    - "python3 orchestrator/pure_python_symbolic.py real-binaries/crackme-angr 2>&1 | head -6 || true"

    # ---- stage 5: 校验点定位 analysis_v2 ----
    - "echo '=== [5/8] 校验点定位 ==='"
    - "python3 lib/analysis_v2.py real-binaries/crackme-angr 2>&1 | head -6 || true"

    # ---- stage 6: 策略生成 llm_engine ----
    - "echo '=== [6/8] 策略生成 ==='"
    - "python3 lib/llm_engine.py real-binaries/crackme-angr 2>&1 | head -8 || true"

    # ---- stage 7: patch + 验证 ----
    - "echo '=== [7/8] patch + 验证 ==='"
    - "mkdir -p /tmp/out"
    - "python3 unified-analysis/analysis_all.py real-binaries/crackme-angr --out /tmp/out --json > /tmp/report.json || true"
    - "cp /tmp/out/*-cracked /tmp/out/cracked-binary 2>/dev/null || true"
    - "python3 -c \"
import subprocess, os
bins = [f for f in os.listdir('/tmp/out') if 'cracked' in f]
if bins:
    r = subprocess.run(['/tmp/out/'+bins[0],'x'], capture_output=True, timeout=10)
    open('/tmp/verify.log','w').write(f'rc={r.returncode} out={r.stdout[:60]}\\n')
    print(f'verify: rc={r.returncode} out={r.stdout[:60]}')
else:
    open('/tmp/verify.log','w').write('no cracked binary\\n')
    print('verify: 无破解二进制')
\" || true"

    # ---- stage 8: 打包 ----
    - "echo '=== [8/8] 打包 ==='"
    - "echo '# 极狐 CI 分析报告' > /tmp/report.md"
    - "echo \"- pipeline: $CI_PIPELINE_ID\" >> /tmp/report.md"
    - "echo '- 目标: real-binaries/crackme-angr' >> /tmp/report.md"
    - "cat /tmp/report.json >> /tmp/report.md 2>/dev/null || true"
    - "ls -la /tmp/out/ 2>/dev/null || true"
  artifacts:
    paths:
      - /tmp/report.md
      - /tmp/verify.log
    expire_in: 7 days
    when: always
