# .gitlab-ci.yml —— 极狐 GitLab CI(计算后端)

stages:
  - analyze

analyze:
  stage: analyze
  image: python:3.12
  script:
    - "apt-get update -qq"
    - "apt-get install -y -qq gcc gdb binutils"
    - "pip install --quiet capstone pyelftools pefile"
    - "cd up-tools"
    - "python3 -c \"import capstone, elftools, pefile; print('deps OK')\""
  artifacts:
    paths:
      - up-tools/*.md
    expire_in: 7 days
    when: always
